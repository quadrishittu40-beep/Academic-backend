<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maknazul 'Irfan Academy — Portal</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#163832">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MIA Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  :root{
    --ink:#1C1B17;
    --cream:#F6F1E4;
    --teal:#163832;
    --teal-deep:#0E2622;
    --gold:#B7862C;
    --gold-soft:#D9B368;
    --sage:#E4E8DE;
    --white:#FFFDF8;
    --line:rgba(28,27,23,0.14);
    --danger:#9B3B33;
    --ok:#3B6B4E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.serif{font-family:'Amiri',serif;}
  .app{display:flex;min-height:100vh;}

  /* ---------- Gate (role select / login) ---------- */
  .gate{
    min-height:100vh;width:100%;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(183,134,44,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(22,56,50,0.10), transparent 45%),
      var(--cream);
    padding:32px 16px;
  }
  .gate-card{
    width:100%;max-width:440px;
    background:var(--white);
    border:1px solid var(--line);
    padding:40px 36px;
    position:relative;
  }
  .gate-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:repeating-linear-gradient(135deg,var(--teal) 0 8px, var(--gold) 8px 16px);
  }
  .mark{
    display:flex;align-items:center;gap:12px;margin-bottom:6px;
  }
  .logo-img{width:64px;height:64px;object-fit:contain;flex:none;}
  .intro-text{color:#5b584f;font-size:13px;line-height:1.6;margin:2px 0 22px;}
  .contact-block{
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:6px;
  }
  .contact-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--teal-deep);}
  .contact-row .c-ico{
    width:22px;height:22px;flex:none;border-radius:50%;background:var(--sage);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--teal);
  }
  .gate-card h1{font-size:23px;margin:14px 0 2px;color:var(--teal-deep);font-weight:700;}
  .gate-sub{color:#5b584f;font-size:13.5px;margin-bottom:28px;}
  .role-row{display:flex;gap:10px;margin-bottom:22px;}
  .role-btn{
    flex:1;padding:14px 10px;background:var(--sage);
    border:1px solid var(--line);color:var(--ink);
    font-family:'Inter';font-size:13.5px;font-weight:600;cursor:pointer;
    text-align:left;
  }
  .role-btn small{display:block;font-weight:400;color:#5b584f;margin-top:3px;font-size:12px;}
  .role-btn.active{background:var(--teal);color:var(--white);border-color:var(--teal);}
  .role-btn.active small{color:#cfe0d9;}
  .tab-row{display:flex;gap:2px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab-row button{
    flex:1;background:none;border:none;padding:10px 4px;font-family:'Inter';font-size:13.5px;
    font-weight:600;color:#8a8776;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab-row button.active{color:var(--teal-deep);border-bottom:2px solid var(--gold);}
  .form-err{background:#FBEDEB;border:1px solid var(--danger);color:var(--danger);font-size:12.5px;padding:9px 12px;margin-bottom:14px;}
  .demo-row{display:flex;gap:8px;margin-top:14px;}
  .demo-row .btn{flex:1;font-size:12px;padding:9px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:#5b584f;margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);
    background:var(--cream);font-family:'Inter';font-size:14px;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;background:var(--teal);color:var(--white);
    border:none;font-family:'Inter';font-weight:600;font-size:13.5px;cursor:pointer;
  }
  .btn:hover{background:var(--teal-deep);}
  .btn.gold{background:var(--gold);color:var(--teal-deep);}
  .btn.gold:hover{background:var(--gold-soft);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn.block{width:100%;}
  .gate-foot{margin-top:16px;font-size:12px;color:#8a8776;text-align:center;}

  /* ---------- Shell ---------- */
  .sidebar{
    width:236px;flex:none;background:var(--teal);color:var(--white);
    display:flex;flex-direction:column;padding:26px 18px;
    min-height:100vh;position:sticky;top:0;
  }
  .side-mark{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .side-mark img{width:34px;height:34px;object-fit:contain;flex:none;}
  .side-title{font-family:'Amiri',serif;font-size:15px;line-height:1.25;font-weight:700;}
  .side-title small{display:block;font-family:'Inter';font-weight:400;font-size:11px;color:#a9c2ba;margin-top:2px;}
  .side-role{
    margin:20px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;
    color:#8fb0a6;
  }
  nav.side-nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  nav.side-nav button{
    text-align:left;background:none;border:none;color:#dfe9e4;
    padding:10px 10px;font-family:'Inter';font-size:13.5px;cursor:pointer;
    border-left:2px solid transparent;
  }
  nav.side-nav button:hover{background:rgba(255,255,255,0.06);}
  nav.side-nav button.active{
    background:rgba(255,255,255,0.09);border-left:2px solid var(--gold);color:var(--white);font-weight:600;
  }
  .side-spacer{flex:1;}
  .side-user{
    border-top:1px solid rgba(255,255,255,0.14);padding-top:14px;font-size:12.5px;color:#cfe0d9;
  }
  .side-user b{display:block;color:var(--white);font-size:13px;margin-bottom:2px;}
  .switch-link{background:none;border:none;color:#a9c2ba;font-size:12px;cursor:pointer;padding:0;margin-top:10px;text-decoration:underline;}

  .main{flex:1;padding:34px 44px;max-width:1080px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
  .page-head h2{font-size:24px;margin:0;color:var(--teal-deep);font-weight:700;}
  .page-head p{margin:4px 0 0;color:#6b6858;font-size:13.5px;}
  .eyebrow{font-size:11px;color:var(--gold);letter-spacing:0.03em;margin-bottom:4px;}

  .grid{display:grid;gap:18px;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:1.3fr 1fr;}
  @media(max-width:900px){.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

  .panel{
    background:var(--white);border:1px solid var(--line);padding:22px 24px;
  }
  .panel h3{font-size:15.5px;margin:0 0 4px;color:var(--teal-deep);}
  .stat{padding:20px;background:var(--white);border:1px solid var(--line);border-top:3px solid var(--gold);}
  .stat .num{font-family:'Amiri',serif;font-size:30px;color:var(--teal-deep);font-weight:700;}
  .stat .lbl{font-size:12.5px;color:#6b6858;margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;color:#6b6858;
     padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;}
  td{padding:11px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 10px;font-size:11.5px;border:1px solid var(--line);}
  .pill.ok{color:var(--ok);border-color:var(--ok);}
  .pill.pending{color:var(--gold);border-color:var(--gold);}
  .pill.due{color:var(--danger);border-color:var(--danger);}

  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .muted{color:#6b6858;font-size:13px;}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  .tag-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .tag{font-size:11.5px;padding:4px 9px;background:var(--sage);color:var(--teal-deep);}

  .lecture-card{border:1px solid var(--line);padding:18px;background:var(--white);}
  .lecture-card + .lecture-card{margin-top:12px;}
  .lecture-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .lecture-top h4{margin:0 0 3px;font-size:15px;color:var(--teal-deep);}

  .paynote{
    border:1px dashed var(--gold);background:#FBF6EA;padding:14px 16px;font-size:12.5px;color:#5b4a1f;margin-top:16px;
  }
  form .two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  @media(max-width:600px){form .two-col{grid-template-columns:1fr;}}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--teal-deep);color:var(--white);
    padding:13px 18px;font-size:13.5px;border-left:3px solid var(--gold);
    box-shadow:0 8px 24px rgba(0,0,0,0.18);z-index:50;max-width:300px;
  }
  .modal-overlay{
    position:fixed;inset:0;background:rgba(14,38,34,0.55);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;
  }
  .modal-card{
    width:100%;max-width:420px;background:var(--white);border:1px solid var(--line);
    padding:30px 28px;position:relative;max-height:90vh;overflow:auto;
  }
  .modal-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:repeating-linear-gradient(135deg,var(--teal) 0 8px, var(--gold) 8px 16px);
  }
  .modal-close{position:absolute;top:14px;right:14px;background:none;border:none;font-size:18px;color:#8a8776;cursor:pointer;}
  .modal-amount{font-family:'Amiri',serif;font-size:30px;color:var(--teal-deep);font-weight:700;margin:2px 0 2px;}
  .card-visual{
    background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:var(--white);
    padding:18px 20px;margin:16px 0 20px;position:relative;overflow:hidden;
  }
  .card-visual::after{content:"";position:absolute;top:-30%;right:-10%;width:140px;height:140px;
    background:radial-gradient(circle,rgba(183,134,44,0.35),transparent 70%);}
  .card-visual .cv-number{font-family:'Inter';letter-spacing:2px;font-size:16px;margin:14px 0 10px;}
  .card-visual .cv-row{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:0.04em;color:#cfe0d9;text-transform:uppercase;}
  .card-visual .cv-name{font-size:12.5px;margin-top:2px;}
  .two-col.cc-row{grid-template-columns:1fr 1fr;}
  .checkout-success{text-align:center;padding:8px 0 4px;}
  .checkout-success .ok-badge{
    width:52px;height:52px;border-radius:50%;background:var(--sage);color:var(--ok);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px;
  }
  .receipt-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .receipt-row:last-child{border-bottom:none;}

  /* ---------- Public landing page ---------- */
  .landing{min-height:100vh;background:var(--cream);}
  .landing-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 6vw;border-bottom:1px solid var(--line);background:var(--white);
    position:sticky;top:0;z-index:10;
  }
  .landing-nav .brand{display:flex;align-items:center;gap:10px;}
  .landing-nav .brand img{width:38px;height:38px;object-fit:contain;}
  .landing-nav .brand span{font-family:'Amiri',serif;font-weight:700;font-size:16px;color:var(--teal-deep);}
  .landing-nav-links{display:flex;gap:10px;}
  .landing-hero{
    padding:64px 6vw 56px;text-align:center;
    background:
      radial-gradient(circle at 12% 15%, rgba(183,134,44,0.10), transparent 42%),
      radial-gradient(circle at 88% 75%, rgba(22,56,50,0.10), transparent 45%),
      var(--cream);
  }
  .landing-hero img{width:96px;height:96px;object-fit:contain;margin:0 auto 18px;}
  .landing-hero .eyebrow{justify-content:center;display:flex;}
  .landing-hero h1{font-size:34px;color:var(--teal-deep);margin:6px 0 14px;font-weight:700;}
  .landing-hero p{max-width:620px;margin:0 auto 28px;color:#5b584f;font-size:15px;line-height:1.7;}
  .cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .audience-row{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap;}
  .audience-pill{font-size:12.5px;padding:6px 14px;background:var(--white);border:1px solid var(--line);color:var(--teal-deep);}

  .landing-section{padding:52px 6vw;max-width:1100px;margin:0 auto;}
  .landing-section h2{font-size:22px;color:var(--teal-deep);margin:0 0 8px;text-align:center;}
  .landing-section .sec-sub{text-align:center;color:#6b6858;font-size:13.5px;margin:0 0 32px;}
  .prog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media(max-width:900px){.prog-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.prog-grid{grid-template-columns:1fr;}.landing-hero h1{font-size:27px;}}
  .prog-card{background:var(--white);border:1px solid var(--line);border-top:3px solid var(--gold);padding:20px;}
  .prog-card h3{font-size:14.5px;color:var(--teal-deep);margin:0 0 8px;}
  .prog-card p{font-size:12.5px;color:#6b6858;line-height:1.6;margin:0;}

  .landing-footer{
    background:var(--teal);color:#dfe9e4;padding:40px 6vw;
  }
  .landing-footer .foot-grid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;max-width:1100px;margin:0 auto;}
  .landing-footer .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .landing-footer .brand img{width:32px;height:32px;object-fit:contain;}
  .landing-footer .brand span{font-family:'Amiri',serif;font-weight:700;color:var(--white);font-size:15px;}
  .landing-footer .contact-row{color:#dfe9e4;}
  .landing-footer .contact-row .c-ico{background:rgba(255,255,255,0.12);color:var(--gold-soft);}
  .landing-footer .foot-note{margin-top:24px;font-size:11.5px;color:#8fb0a6;text-align:center;}
  .hidden{display:none !important;}
  ::selection{background:var(--gold-soft);}
</style>
</head>

/* ---------------- Helpers ---------------- */
function studentBalance(id){
  const s = state.students.find(x=>x.id===id);
  return s ? (s.balance||0) : 0;
}
function studentStatusLabel(id){
  const s = state.students.find(x=>x.id===id);
  return s ? (s.status || (s.balance>0?'Fee due':'Active')) : 'Active';
}
function allResultsFlat(){
  const rows=[];
  Object.keys(state.resultsByStudent).forEach(sid=>{
    const student = state.students.find(s=>s.id===sid);
    (state.resultsByStudent[sid]||[]).forEach((r,idx)=> rows.push({sid, idx, id:r.id, name: student?student.name:sid, ...r}));
  });
  return rows;
}

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

/* ---------------- Views ---------------- */

function goToAuth(tab){ state.showAuth = true; state.showPublicRegister = false; state.authTab = tab || 'signin'; state.formError=null; render(); window.scrollTo(0,0); }
function goToLanding(){ state.showAuth = false; state.showPublicRegister = false; render(); window.scrollTo(0,0); }

/* ---------------- API layer (talks to the real backend) ---------------- */
async function apiRequest(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  let res;
  try{
    res = await fetch(state.apiBase + path, Object.assign({}, opts, {headers}));
  }catch(err){
    throw new Error("Can't reach the academy server. Check the API URL in Settings and make sure the backend is running.");
  }
  let body = null;
  try{ body = await res.json(); }catch(e){ /* no body */ }
  if(!res.ok){
    throw new Error((body && body.error) || ('Request failed (' + res.status + ').'));
  }
  return body;
}

function setApiBase(url){
  state.apiBase = (url||'').trim().replace(/\/+$/,'');
  render();
}

      state.examRegistrations = await apiRequest('/api/exam-registrations');

function luhnValid(num){
  const digits = num.replace(/\D/g,'');
  if(digits.length < 13 || digits.length > 19) return false;
  let sum = 0, alt = false;
  for(let i=digits.length-1;i>=0;i--){
    let d = parseInt(digits[i],10);
    if(alt){ d*=2; if(d>9) d-=9; }
    sum+=d; alt=!alt;
  }
  return sum % 10 === 0;
}
function formatCardNumber(input){
  let digits = input.value.replace(/\D/g,'').slice(0,19);
  input.value = digits.replace(/(.{4})/g,'$1 ').trim();
  updateCardVisual();
}
function formatExpiry(input){
  let digits = input.value.replace(/\D/g,'').slice(0,4);
  if(digits.length>=3) digits = digits.slice(0,2)+'/'+digits.slice(2);
  input.value = digits;
  updateCardVisual();
}

  if(vName) vName.textContent = (nameEl && nameEl.value) ? nameEl.value.toUpperCase() : 'CARDHOLDER NAME';
  if(vExp) vExp.textContent = (expEl && expEl.value) ? expEl.value : 'MM/YY';
}

function payWithPaystack(){
  const c = state.checkout;
  const rawEmail = (state.session && state.session.email) || '';
  const isValidEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(rawEmail);
  // Accounts created from an approved registration log in with a registration
  // number (e.g. "mia-0233"), not a real email — Paystack requires a proper
  // email format, so fall back to a harmless placeholder in that case.
  const email = isValidEmail ? rawEmail : `${(state.session.studentId||'guest').toLowerCase()}@maknazulirfanacademy.ng`;
  c.error = null;
  render();
  try{
    const reference = 'MIA-' + c.id + '-' + Date.now();
    const handler = PaystackPop.setup({
      key: state.paystackPublicKey,
      email: email,
      amount: Math.round(c.amount * 100), // kobo
      currency: 'NGN',
      ref: reference,
      metadata: { paymentId: String(c.id) },
      callback: function(response){
        confirmPaystackPayment(response.reference);
      },
      onClose: function(){
        // Popup dismissed without paying — leave the checkout modal as-is.
      }
    });
    handler.openIframe();
  }catch(err){
    c.error = 'Could not open Paystack: ' + err.message;
    render();
  }
}

function numberToWords(num){
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function chunk(n){
    let s='';
    if(n>=100){ s+=ones[Math.floor(n/100)]+' Hundred'; n%=100; if(n) s+=' and '; }
    if(n>=20){ s+=tens[Math.floor(n/10)]; if(n%10) s+=' '+ones[n%10]; }
    else if(n>0){ s+=ones[n]; }
    return s;
  }
  let n = Math.floor(num);
  if(n===0) return 'Zero';
  const parts=[];
  const million=Math.floor(n/1000000); n%=1000000;
  const thousand=Math.floor(n/1000); n%=1000;
  if(million) parts.push(chunk(million)+' Million');
  if(thousand) parts.push(chunk(thousand)+' Thousand');
  if(n) parts.push(chunk(n));
  return parts.join(' ');
}

function printReceiptData(data){
  // data: { studentName, studentId, desc, amount, txn, paidAt }
  const when = data.paidAt || new Date();

  const timeStr = when.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });

function printReceipt(){
  const c = state.checkout;
  if(!c) return;
  printReceiptData({
    studentName: state.session ? state.session.name : '',
    studentId: (state.session && state.session.studentId) ? state.session.studentId : '',
    desc: c.desc, amount: c.amount, txn: c.txn, paidAt: c.paidAt
  });
}

function printAdmissionReceipt(){
  const r = state.admissionReceipt;
  if(!r) return;
  printReceiptData({
    studentName: r.name, studentId: '', desc: 'Admission Fee', amount: r.amount, txn: r.reference, paidAt: r.paidAt
  });
}

async function confirmPaystackPayment(reference){
  if(!state.checkout) return;
  state.checkout.step = 'processing';
  render();
  try{
    const paid = await apiRequest('/api/payments/'+state.checkout.id+'/pay', {
      method:'POST', body: JSON.stringify({ reference })
    });
    const sid = state.session && state.session.studentId;
    state.paymentsByStudent[sid] = await apiRequest('/api/payments/mine');
    const me = await apiRequest('/api/students/me');
    state.students = [me];
    if(!state.checkout) return; // modal closed mid-flight
    state.checkout.step='success';
    state.checkout.txn=paid.txn;
    state.checkout.paidAt=new Date();
  }catch(err){
    if(!state.checkout) return;
    state.checkout.step='form';
    state.checkout.error=err.message;
  }
  render();
}

function submitSimulatedCheckout(e){
  const name = document.getElementById('co-card-name').value.trim();
  const number = document.getElementById('co-card-num').value;
  const expiry = document.getElementById('co-card-exp').value;
  const cvc = document.getElementById('co-card-cvc').value;

  if(!name){ state.checkout.error='Enter the name on the card.'; render(); return false; }
  if(!luhnValid(number)){ state.checkout.error='That card number doesn\'t look valid.'; render(); return false; }
  const m = /^(\d{2})\/(\d{2})$/.exec(expiry);
  if(!m){ state.checkout.error='Enter expiry as MM/YY.'; render(); return false; }
  const month = parseInt(m[1],10), year = 2000+parseInt(m[2],10);
  const now = new Date();
  const expDate = new Date(year, month, 0);
  if(month<1 || month>12 || expDate < now){ state.checkout.error='That card has expired or the date is invalid.'; render(); return false; }
  if(!/^\d{3,4}$/.test(cvc)){ state.checkout.error='CVC should be 3 or 4 digits.'; render(); return false; }

  state.checkout.error = null;
  state.checkout.step = 'processing';
  render();

  (async()=>{
    try{
      const paid = await apiRequest('/api/payments/'+state.checkout.id+'/pay', { method:'POST' });
      const sid = state.session && state.session.studentId;
      state.paymentsByStudent[sid] = await apiRequest('/api/payments/mine');
      const me = await apiRequest('/api/students/me');
      state.students = [me];
      if(!state.checkout) return; // modal was closed mid-flight
      state.checkout.step='success';
      state.checkout.txn=paid.txn;
      state.checkout.paidAt=new Date();
    }catch(err){
      if(!state.checkout) return;
      state.checkout.step='form';
      state.checkout.error=err.message;
    }
    render();
  })();
  return false;
}

async function sendFeeReminders(){
  try{

function collectRegistrationForm(){
  return {
    name: document.getElementById('reg-name').value.trim(),
    dob: document.getElementById('reg-dob').value,
    gender: document.getElementById('reg-gender').value,
    address: document.getElementById('reg-address').value.trim(),
    guardianName: document.getElementById('reg-guardian-name').value.trim(),
    guardianPhone: document.getElementById('reg-guardian-phone').value.trim(),
    guardianEmail: document.getElementById('reg-guardian-email').value.trim(),
    track: document.getElementById('reg-track').value,
    intake: document.getElementById('reg-intake').value.trim(),
    prevSchool: document.getElementById('reg-prev-school').value.trim(),
    notes: document.getElementById('reg-notes').value.trim(),
  };
}

function submitRegistration(e){
  e.preventDefault();
  const data = collectRegistrationForm();
  if(!data.name || !data.track || (!data.guardianPhone && !data.guardianEmail)){
    state.regFormError = "Please fill in the student's name, programme, and at least one guardian contact.";
    render();
    return false;
  }
  state.regFormError = null;
  if(state.paystackPublicKey && window.PaystackPop){
    payAdmissionFee(data);
  } else {
    finalizeRegistration(data, null);
  }
  return false;
}

function payAdmissionFee(data){
  const isValidEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.guardianEmail);
  const email = isValidEmail ? data.guardianEmail : `${(data.name||'applicant').toLowerCase().replace(/\s+/g,'.')}@maknazulirfanacademy.ng`;
  const reference = 'ADM-' + Date.now();
  try{
    const handler = PaystackPop.setup({
      key: state.paystackPublicKey,
      email: email,
      amount: 1000000, // ₦10,000 in kobo
      currency: 'NGN',
      ref: reference,
      metadata: { type: 'admission', name: data.name },
      callback: function(response){
        finalizeRegistration(data, response.reference);
      },
      onClose: function(){ /* popup dismissed — applicant stays on the form, nothing submitted */ }
    });
    handler.openIframe();
  }catch(err){
    state.regFormError = 'Could not open Paystack: ' + err.message;
    render();
  }
}

async function finalizeRegistration(data, reference){
  state.regSubmitting = true;
  state.regFormError = null;
  render();
  try{
    await apiRequest('/api/registrations', { method:'POST', body: JSON.stringify({ ...data, reference }) });
    if(state.role==='admin'){
      state.registrations = await apiRequest('/api/registrations');
      const notifs = await apiRequest('/api/notifications');
      state.notifications = notifs.map(n=>({id:n.id, type:n.type, message:n.message, to:n.to_addr, date:n.date}));
    }
    state.regSubmitting = false;
    state.showPublicRegister = false;
    state.showAuth = false;
    if(reference){
      state.admissionReceipt = { name: data.name, amount: 10000, reference, paidAt: new Date() };
    } else {
      showToast('Application submitted! Our office will review it shortly.');
    }
  }catch(err){
    state.regSubmitting = false;
    state.regFormError = err.message;
  }
  render();
}
function closeAdmissionReceipt(){ state.admissionReceipt = null; render(); }
function AdmissionReceiptModal(){

async function approveRegistration(i){
  const reg = state.registrations[i];
  try{
    const result = await apiRequest('/api/registrations/'+reg.id+'/approve', { method:'POST' });
    state.students = await apiRequest('/api/students');
    state.registrations = await apiRequest('/api/registrations');

    state.notifications = notifs.map(n=>({id:n.id, type:n.type, message:n.message, to:n.to_addr, date:n.date}));

  }catch(err){
    showToast(err.message);
  }
  render();
}

function toggleResultForm(mode, sid, idx){
  state.showResultForm = mode ? { mode, sid, idx } : null;
  render();
}
async function refreshAdminResults(){
  const results = await apiRequest('/api/results');
  state.resultsByStudent = {};
  results.forEach(r=>{
    if(!state.resultsByStudent[r.student_id]) state.resultsByStudent[r.student_id] = [];
    state.resultsByStudent[r.student_id].push({id:r.id, subject:r.subject, term:r.term, score:r.score, grade:r.grade});
  });
}
async function submitResult(e){
  e.preventDefault();
  const editing = state.showResultForm.mode==='edit';
  const sid = editing ? state.showResultForm.sid : document.getElementById('rf-student').value;
  const term = document.getElementById('rf-term').value;
  const subject = document.getElementById('rf-subject').value;
  const score = document.getElementById('rf-score').value;
  const grade = document.getElementById('rf-grade').value;
  try{
    if(editing){
      const id = state.resultsByStudent[sid][state.showResultForm.idx].id;
      await apiRequest('/api/results/'+id, { method:'PUT', body: JSON.stringify({ subject, term, score, grade }) });
    } else {
      await apiRequest('/api/results', { method:'POST', body: JSON.stringify({ studentId: sid, subject, term, score, grade }) });
    }
    await refreshAdminResults();
    state.showResultForm = null;
    showToast('Result saved.');
  }catch(err){
    showToast(err.message);
  }
  render();
  return false;
}
async function deleteResult(sid, idx){
  const id = state.resultsByStudent[sid] && state.resultsByStudent[sid][idx] && state.resultsByStudent[sid][idx].id;
  try{
    if(id) await apiRequest('/api/results/'+id, { method:'DELETE' });
    await refreshAdminResults();
    showToast('Result removed.');
  }catch(err){
    showToast(err.message);
  }
  render();
}

initApp();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(()=>{ /* offline caching just won't be available */ });
  });
}
